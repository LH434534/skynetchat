<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SkynetChat — assistente single-file</title>
<style>
:root{
  --bg:#0f1115; --panel:#151922; --card:#1a1f2b; --line:#252b38;
  --fg:#e8ecf2; --dim:#98a2b3; --acc:#5eead4; --acc2:#60a5fa; --warn:#fbbf24; --err:#f87171;
  --r:14px; --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root{--bg:#f7f8fa;--panel:#fff;--card:#fff;--line:#e3e6ec;--fg:#14181f;--dim:#5b6473;--acc:#0d9488;--acc2:#2563eb}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;overscroll-behavior-y:none}
#app{display:flex;flex-direction:column;height:100dvh;max-width:820px;margin:0 auto;position:relative}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:20}
.brand{font-weight:800;letter-spacing:.2px;font-size:17px}
.brand span{color:var(--acc)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);margin-left:2px}
.dot.on{background:var(--acc);box-shadow:0 0 8px var(--acc)}
.spacer{flex:1}
.iconbtn{background:transparent;border:1px solid var(--line);color:var(--fg);border-radius:10px;
  min-width:38px;height:34px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px}
.iconbtn:active{transform:scale(.94)}
nav{display:none;gap:4px;padding:6px 8px;background:var(--panel);border-bottom:1px solid var(--line)}
nav button{flex:1;background:transparent;border:0;color:var(--dim);padding:8px;font-size:13px;font-weight:600;border-radius:10px;cursor:pointer}
nav button.on{background:var(--card);color:var(--fg)}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px calc(96px + var(--safe-b))}
main.chatpad{padding-bottom:calc(110px + var(--safe-b))}
.msg{max-width:100%;margin-bottom:10px;display:flex}
.msg.me{justify-content:flex-end}
.bubble{max-width:86%;padding:10px 13px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);
  white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
.msg.me .bubble{background:var(--acc);color:#04120f;border-color:transparent;font-weight:500}
.bubble.tool{background:transparent;border:1px dashed var(--line);color:var(--dim);font-size:13px}
.bubble b{color:var(--acc2)}
.bubble code{background:rgba(127,127,127,.18);padding:1px 5px;border-radius:5px;font-size:13px}
.bubble pre{background:rgba(127,127,127,.12);padding:10px;border-radius:10px;overflow-x:auto}
.bubble a{color:var(--acc2)}
.bubble ul{margin:6px 0;padding-left:20px}
.thinking{display:inline-flex;gap:4px;align-items:center;color:var(--dim);font-size:13px}
.thinking i{width:5px;height:5px;border-radius:50%;background:var(--dim);animation:b 1s infinite}
@keyframes b{0%,60%,100%{opacity:.25}30%{opacity:1}}
.composer{position:absolute;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);
  padding:8px 10px calc(8px + var(--safe-b));display:flex;gap:8px;align-items:flex-end;z-index:30}
textarea{flex:1;resize:none;border:1px solid var(--line);background:var(--card);color:var(--fg);
  border-radius:12px;padding:10px 12px;font:inherit;max-height:120px;min-height:42px;outline:none}
textarea:focus{border-color:var(--acc)}
.send{background:var(--acc);color:#04120f;border:0;border-radius:12px;height:42px;min-width:52px;font-weight:800;cursor:pointer}
.send:disabled{opacity:.4}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;cursor:pointer;position:relative}
.tile:active{transform:scale(.98)}
.tile h4{margin:0 0 4px;font-size:13px}
.tile p{margin:0;font-size:11.5px;color:var(--dim);line-height:1.4}
.tile .st{position:absolute;top:8px;right:8px;font-size:10px;padding:2px 6px;border-radius:20px;background:var(--line);color:var(--dim)}
.tile .st.ok{background:rgba(94,234,212,.16);color:var(--acc)}
.tile .st.no{background:rgba(248,113,113,.16);color:var(--err)}
.sec{margin-bottom:16px}
.sec>h3{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
label{display:block;font-size:12px;color:var(--dim);margin:8px 0 4px}
input,select{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--fg);
  border-radius:10px;padding:9px 11px;font:inherit;outline:none}
.row{display:flex;gap:8px}
.row>*{flex:1}
button.b{background:var(--acc);color:#04120f;border:0;border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer;width:100%}
button.g{background:transparent;border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:9px 12px;cursor:pointer;width:100%}
.muted{color:var(--dim);font-size:12px;line-height:1.5}
.kv{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.kv:last-child{border:0}
.kv b{font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:3px 9px;border-radius:20px;background:var(--line);font-size:11px;color:var(--dim);margin:2px 4px 2px 0}
.hidden{display:none!important}
.copy{display:block;margin-top:8px;background:transparent;border:1px solid var(--line);
  color:var(--dim);border-radius:8px;padding:3px 10px;font-size:11px;cursor:pointer}
.copy:active{transform:scale(.95)}
img.gen{width:100%;border-radius:12px;margin-top:8px;border:1px solid var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + var(--safe-b));background:var(--fg);color:var(--bg);
  padding:8px 14px;border-radius:20px;font-size:13px;font-weight:600;z-index:99;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">Skynet<span>Chat</span></div>
    <div id="net" class="dot" title="conectividade"></div>
    <div class="spacer"></div>
    <button class="iconbtn" id="btnVoice" title="falar">🎤</button>
    <button class="iconbtn" id="btnStop" title="parar/sair do modo local" hidden>⏹</button>
    <button class="iconbtn" id="btnNew" title="nova conversa">＋</button>
    <button class="iconbtn" id="btnMenu" title="painéis">☰</button>
  </header>

  <nav id="nav">
    <button data-tab="chat" class="on">Chat</button>
    <button data-tab="tools">Ferramentas</button>
    <button data-tab="status">Status</button>
    <button data-tab="cfg">Ajustes</button>
  </nav>

  <main id="main" class="chatpad">
    <div id="chat"></div>
  </main>

  <div class="composer" id="composer">
    <textarea id="txt" rows="1" placeholder="Pergunte, ou peça: clima, bitcoin, dólar, wiki, notícias…"></textarea>
    <button class="send" id="send">Enviar</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* =========================================================================
   SkynetChat — 50 ferramentas reais, offline-first.
   Principios:
     - nenhuma dependencia externa (sem CDN, sem framework)
     - toda chamada de rede tem timeout e degrada
     - o autoteste mostra o que REALMENTE funciona no seu navegador
     - chaves ficam so no localStorage deste dispositivo
   ========================================================================= */

const $ = s => document.querySelector(s);
const txt = $("#txt"), main = $("#main");
const chat = () => $("#chat");  // re-consulta: navTo substitui o DOM
const LS = "skynetchat.v1";

const state = load();
function load(){
  try{ return Object.assign({msgs:[],keys:{},provider:"auto",voice:false,tests:{},model:""}, JSON.parse(localStorage.getItem(LS)||"{}")); }
  catch(e){ return {msgs:[],keys:{},provider:"auto",voice:false,tests:{},model:""}; }
}
function save(){ try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){} }

function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("on"),1600); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function md(s){
  let h = esc(s);
  h = h.replace(/```([\s\S]*?)```/g,(m,c)=>"<pre><code>"+c.trim()+"</code></pre>");
  h = h.replace(/`([^`\n]+)`/g,"<code>$1</code>");
  h = h.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
  h = h.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  h = h.replace(/(^|\n)[-*] (.+)/g,"$1• $2");
  return h;
}
function bubble(cls, html){
  const d=document.createElement("div"); d.className="msg"+(cls?" "+cls:"");
  const b=document.createElement("div"); b.className="bubble"; b.innerHTML=html;
  if(!cls) addCopy(b);
  d.appendChild(b); chat().appendChild(d); main.scrollTop=main.scrollHeight; return b;
}
function thinking(label){
  const b=bubble("", '<span class="thinking">'+esc(label)+' <i></i><i></i><i></i></span>');
  return { el:b, done(html){
    b.innerHTML=html;
    // done() substitui o innerHTML: o botao copiar precisa ser recriado
    if(!b.querySelector(".copy")) addCopy(b);
    main.scrollTop=main.scrollHeight;
  } };
}
function addCopy(b){
  const c=document.createElement("button");
  c.className="copy"; c.textContent="copiar"; c.title="copiar texto";
  c.onclick=()=>{ navigator.clipboard?.writeText(b.innerText).then(()=>toast("copiado"),()=>toast("sem permissão")); };
  b.appendChild(c);
}

/* ---------------------------------------------------------------- fetch util */
async function jget(url, ms=9000){
  const c=new AbortController(); const t=setTimeout(()=>c.abort(), ms);
  try{
    const r=await fetch(url,{signal:c.signal,headers:{Accept:"application/json"}});
    if(!r.ok) throw new Error("HTTP "+r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}
async function tget(url, ms=9000){
  const c=new AbortController(); const t=setTimeout(()=>c.abort(), ms);
  try{
    const r=await fetch(url,{signal:c.signal});
    if(!r.ok) throw new Error("HTTP "+r.status);
    return await r.text();
  } finally { clearTimeout(t); }
}
async function tries(fn, label){
  const t=thinking(label||"consultando");
  try{ const v=await fn(); return {t, v}; }
  catch(e){ t.done("❌ "+esc(e.message||"falhou")); return {t, v:null}; }
}

/* ============================================================ CATALOGO DE APIs
   Endpoints publicos sem chave. `cors` e expectativa, NAO garantia:
   o autoteste confirma no seu navegador.
   ========================================================================= */
const API = [
  // -- clima & lugar -------------------------------------------------------
  {id:"meteo", cat:"Clima", name:"Previsão do tempo", desc:"Open-Meteo: atual, horária e 7 dias", cors:true,
   args:[{k:"q",label:"cidade",ph:"São Paulo"}],
   run:async a=>{
     const g=await jget("https://geocoding-api.open-meteo.com/v1/search?name="+encodeURIComponent(a.q||"São Paulo")+"&count=1&language=pt");
     if(!g.results||!g.results[0]) throw new Error("cidade não encontrada");
     const p=g.results[0];
     const w=await jget(`https://api.open-meteo.com/v1/forecast?latitude=${p.latitude}&longitude=${p.longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=auto&forecast_days=5`);
     const W={0:"limpo",1:"quase limpo",2:"parcialmente nublado",3:"nublado",45:"neblina",48:"neblina",51:"garoa",53:"chuva fraca",55:"chuva moderada",61:"chuva fraca",63:"chuva",65:"chuva forte",80:"pancadas",81:"pancadas",82:"pancadas fortes",95:"tempestade"};
     return `**${p.name}** (${p.latitude.toFixed(2)}, ${p.longitude.toFixed(2)})\n`+
       `Agora: **${w.current.temperature_2m}°C** (sensação ${w.current.apparent_temperature}°C), ${W[w.current.weather_code]||"código "+w.current.weather_code}\n`+
       `Umidade ${w.current.relative_humidity_2m}% · vento ${w.current.wind_speed_10m} km/h\n\n`+
       `Próximos dias:\n`+ w.daily.time.map((d,i)=>`• ${d}: ${w.daily.temperature_2m_min[i]}°C → ${w.daily.temperature_2m_max[i]}°C`).join("\n");
   }},
  {id:"airq", cat:"Clima", name:"Qualidade do ar", desc:"Open-Meteo: PM2.5, PM10, ozônio", cors:true,
   args:[{k:"q",label:"cidade",ph:"São Paulo"}],
   run:async a=>{
     const g=await jget("https://geocoding-api.open-meteo.com/v1/search?name="+encodeURIComponent(a.q||"São Paulo")+"&count=1&language=pt");
     const p=g.results[0]; if(!p) throw new Error("cidade não encontrada");
     const r=await jget(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${p.latitude}&longitude=${p.longitude}&current=pm10,pm2_5,carbon_monoxide,ozone,european_aqi&timezone=auto`);
     const c=r.current;
     return `**Qualidade do ar — ${p.name}**\n`+
       `Índice europeu: **${c.european_aqi}**\n`+
       `PM2.5: ${c.pm2_5} µg/m³ · PM10: ${c.pm10} µg/m³\n`+
       `Ozônio: ${c.ozone} · CO: ${c.carbon_monoxide}`;
   }},
  {id:"ipgeo", cat:"Clima", name:"Geolocalizar meu IP", desc:"ipapi.co: onde a rede acha que você está", cors:true,
   run:async()=>{ const r=await jget("https://ipapi.co/json/");
     return `**Seu IP:** ${r.ip}\n${r.city}, ${r.region} — ${r.country_name}\n`+
       `Lat/lon: ${r.latitude}, ${r.longitude}\nFuso: ${r.timezone} · moeda ${r.currency}`; }},
  {id:"tz", cat:"Clima", name:"Hora exata por fuso", desc:"WorldTimeAPI", cors:true,
   args:[{k:"z",label:"fuso",ph:"America/Sao_Paulo"}],
   run:async a=>{ const r=await jget("https://worldtimeapi.org/api/timezone/"+(a.z||"America/Sao_Paulo"));
     return `**${r.timezone}**\n${r.datetime}\nDia da semana: ${r.day_of_week} · ano ${r.day_of_year}/366`; }},
  {id:"sun", cat:"Clima", name:"Nascer e pôr do sol", desc:"sunrise-sunset.org", cors:true,
   args:[{k:"lat",label:"latitude",ph:"-23.55"},{k:"lon",label:"longitude",ph:"-46.63"}],
   run:async a=>{ const r=await jget(`https://api.sunrise-sunset.org/json?lat=${a.lat||-23.55}&lng=${a.lon||-46.63}&formatted=0`);
     return `Nascer: **${new Date(r.results.sunrise).toLocaleTimeString("pt-BR")}**\n`+
       `Pôr: **${new Date(r.results.sunset).toLocaleTimeString("pt-BR")}**\n`+
       `Duração do dia: ${(r.results.day_length/3600).toFixed(1)} h`; }},
  {id:"geo", cat:"Clima", name:"Buscar coordenadas", desc:"Nominatim / OpenStreetMap", cors:true,
   args:[{k:"q",label:"lugar",ph:"Praça da Sé"}],
   run:async a=>{ const r=await jget("https://nominatim.openstreetmap.org/search?format=json&limit=3&q="+encodeURIComponent(a.q));
     if(!r.length) throw new Error("nada encontrado");
     return r.map(p=>`• **${p.display_name}**\n  ${p.lat}, ${p.lon}`).join("\n"); }},
  {id:"country", cat:"Clima", name:"Dados de um país", desc:"REST Countries", cors:true,
   args:[{k:"q",label:"país",ph:"brazil"}],
   run:async a=>{ const r=await jget("https://restcountries.com/v3.1/name/"+encodeURIComponent(a.q||"brazil"));
     const c=r[0]; const cur=Object.keys(c.currencies||{})[0];
     return `**${c.translations?.por?.common||c.name.common}** (${c.cca2})\n`+
       `Capital: ${c.capital?.[0]} · região ${c.region}\n`+
       `População: ${c.population.toLocaleString("pt-BR")}\n`+
       `Moeda: ${cur} · idiomas: ${Object.values(c.languages||{}).join(", ")}`; }},

  // -- finanças ------------------------------------------------------------
  {id:"crypto", cat:"Finanças", name:"Preço de crypto", desc:"CoinGecko: preço, variação 24h", cors:true,
   args:[{k:"q",label:"moeda",ph:"bitcoin"}],
   run:async a=>{
     const id=(a.q||"bitcoin").toLowerCase().trim();
     const r=await jget(`https://api.coingecko.com/api/v3/simple/price?ids=${id}&vs_currencies=usd,brl&include_24hr_change=true&include_market_cap=true`);
     const d=r[id]; if(!d) throw new Error("moeda não encontrada (use o id: bitcoin, ethereum, solana)");
     const pc=d.usd_24h_change;
     return `**${id}**\nUS$ ${d.usd.toLocaleString("en-US")} · R$ ${d.brl?.toLocaleString("pt-BR")}\n`+
       `24h: ${pc>=0?"▲":"▼"} ${pc.toFixed(2)}%\nCap: US$ ${(d.usd_market_cap||0).toLocaleString("en-US")}`; }},
  {id:"top10", cat:"Finanças", name:"Top 10 cryptos", desc:"CoinGecko markets", cors:true,
   run:async()=>{ const r=await jget("https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=10&page=1");
     return r.map((c,i)=>`${i+1}. **${c.symbol.toUpperCase()}** ${c.current_price.toLocaleString("en-US")} · ${c.price_change_percentage_24h.toFixed(2)}%`).join("\n"); }},
  {id:"fx", cat:"Finanças", name:"Câmbio", desc:"Frankfurter (Banco Central Europeu)", cors:true,
   args:[{k:"f",label:"de",ph:"USD"},{k:"t",label:"para",ph:"BRL"}],
   run:async a=>{ const r=await jget(`https://api.frankfurter.app/latest?from=${a.f||"USD"}&to=${a.t||"BRL"}`);
     const k=Object.keys(r.rates)[0];
     return `**${r.base} → ${k}**\n1 ${r.base} = **${r.rates[k]}** ${k}\nData: ${r.date}`; }},
  {id:"fxhist", cat:"Finanças", name:"Histórico de câmbio", desc:"Frankfurter: série temporal", cors:true,
   args:[{k:"f",label:"de",ph:"USD"},{k:"t",label:"para",ph:"BRL"}],
   run:async a=>{
     const fim=new Date().toISOString().slice(0,10);
     const ini=new Date(Date.now()-30*864e5).toISOString().slice(0,10);
     const r=await jget(`https://api.frankfurter.app/${ini}..${fim}?from=${a.f||"USD"}&to=${a.t||"BRL"}`);
     const ks=Object.keys(r.rates).slice(-8);
     return `Últimos dias (${a.f||"USD"}→${a.t||"BRL"}):\n`+ks.map(d=>`• ${d}: ${r.rates[d][a.t||"BRL"]}`).join("\n"); }},
  {id:"kraken", cat:"Finanças", name:"Kraken ticker", desc:"Preço spot BTC/USD", cors:true,
   run:async()=>{ const r=await jget("https://api.kraken.com/0/public/Ticker?pair=XBTUSD");
     const k=Object.keys(r.result)[0], d=r.result[k];
     return `**BTC/USD** (Kraken)\nÚltimo: ${d.c[0]}\nMáx 24h: ${d.h[0]} · mín ${d.l[0]}`; }},
  {id:"cb", cat:"Finanças", name:"Coinbase spot", desc:"Preço à vista", cors:true,
   args:[{k:"q",label:"par",ph:"BTC-USD"}],
   run:async a=>{ const r=await jget("https://api.coinbase.com/v2/prices/"+(a.q||"BTC-USD")+"/spot");
     return `**${r.data.base}/${r.data.currency}** = ${r.data.amount}`; }},

  // -- conhecimento --------------------------------------------------------
  {id:"wiki", cat:"Conhecimento", name:"Resumo Wikipedia", desc:"Wikipédia em português", cors:true,
   args:[{k:"q",label:"tema",ph:"fotossíntese"}],
   run:async a=>{ const r=await jget("https://pt.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(a.q));
     return `**${r.title}**\n${r.extract}\n\n[ler artigo](${r.content_urls.desktop.page})`; }},
  {id:"wikis", cat:"Conhecimento", name:"Buscar Wikipedia", desc:"busca em pt", cors:true,
   args:[{k:"q",label:"termo",ph:"clarice lispector"}],
   run:async a=>{ const r=await jget("https://pt.wikipedia.org/w/api.php?action=query&list=search&srsearch="+encodeURIComponent(a.q)+"&format=json&srlimit=5&origin=*");
     return r.query.search.map((s,i)=>`${i+1}. **${s.title}** — ${s.snippet.replace(/<[^>]+>/g,"")}`).join("\n\n"); }},
  {id:"wikiEn", cat:"Conhecimento", name:"Wikipedia em inglês", desc:"quando pt é escasso", cors:true,
   args:[{k:"q",label:"tema",ph:"quantum entanglement"}],
   run:async a=>{ const r=await jget("https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(a.q));
     return `**${r.title}**\n${r.extract}`; }},
  {id:"dict", cat:"Conhecimento", name:"Dicionário (inglês)", desc:"dictionaryapi.dev", cors:true,
   args:[{k:"q",label:"palavra",ph:"serendipity"}],
   run:async a=>{ const r=await jget("https://api.dictionaryapi.dev/api/v2/entries/en/"+encodeURIComponent(a.q));

async function openAICompat(url,key,model,messages){
  const c=new AbortController(); const t=setTimeout(()=>c.abort(),60000);
  try{
    const r=await fetch(url,{method:"POST",signal:c.signal,
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},
      body:JSON.stringify({model,messages,stream:false})});
    if(!r.ok){ const e=await r.text().catch(()=>""); throw new Error("HTTP "+r.status+" "+e.slice(0,120)); }
    const d=await r.json(); return d.choices?.[0]?.message?.content || "(sem resposta)";
  } finally { clearTimeout(t); }
}

function detectar(t){
  const s=t.toLowerCase();
  for(const [re,id] of REGRAS) if(re.test(s)) return id;
  return null;
}
function extrairArgs(id, texto){
  const spec = API_BY_ID[id]; if(!spec?.args) return {};
  const out={};
  // pega o trecho depois da palavra-chave quando houver "sobre X" / "de X"
  const m = texto.match(/(?:sobre|de|em|para|do|da)\s+(.+)$/i);
  const resto = (m? m[1] : texto).trim();
  spec.args.forEach((a,i)=>{
    if(i===0) out[a.k] = resto.slice(0,80);
    else out[a.k] = a.ph;
  });
  return out;
}

const SYS = "Você é SkynetChat, um assistente direto e preciso em português. "+
  "Seja conciso. Quando receber dados de ferramentas, use-os e cite a fonte. "+
  "Se não souber, diga que não sabe.";

function historico(){
  return [{role:"system",content:SYS}, ...state.msgs.slice(-12).map(m=>({role:m.role,content:m.content}))];
}
async function chamarLLM(msgs){
  const ordem = state.provider==="auto"
    ? [...PROVIDERS.filter(p=>!p.needsKey), ...PROVIDERS.filter(p=>p.needsKey && state.keys[p.id])]
    : PROVIDERS.filter(p=>p.id===state.provider);
  const erros=[];
  for(const p of ordem){
    if(p.needsKey && !state.keys[p.id]) continue;
    try{ const r=await p.call(msgs, state.keys[p.id], state.model); return {txt:r, prov:p.name}; }
    catch(e){ erros.push(p.name+": "+e.message); }
  }
  throw new Error(erros.join(" | ")||"nenhum provedor disponível");
}

async function enviar(){
  const q = txt.value.trim(); if(!q) return;
  txt.value=""; txt.style.height="auto";
  state.msgs.push({role:"user",content:q}); save();
  bubble("me", esc(q));
  await responder(q);
}

async function responder(q){
  const id = detectar(q);
  let contexto = "";

  // 1) ferramenta primeiro (dado real > palpite)
  if(id){
    const spec=API_BY_ID[id];
    const t=thinking("consultando "+spec.name);
    try{
      const r=await spec.run(extrairArgs(id,q));
      t.done("<b>"+esc(spec.name)+"</b>\n"+md(r));
      contexto = `[DADOS REAIS de ${spec.name}]\n${r}`;
      state.msgs.push({role:"system",content:contexto});
    }catch(e){
      t.done("Ferramenta falhou ("+esc(e.message)+"). Tentando o modelo…");
    }
  }

  // 2) modelo de linguagem
  const t=thinking("pensando");
  try{
    const {txt:r, prov} = await chamarLLM(historico());
    t.done(md(r)+`<div style="margin-top:6px"><span class="pill">${esc(prov)}</span></div>`);
    state.msgs.push({role:"assistant",content:r}); save();
  }catch(e){
    t.done(fallback(q, contexto, e.message));
  }
}

function fallback(q, contexto, erro){
  let out = "⚠️ Sem modelo de linguagem disponível.\n\n";
  if(contexto) out += "Os dados reais acima vieram de uma API pública e continuam válidos.\n\n";
  out += "Para ter conversa real, adicione uma chave gratuita em **Ajustes** "+
         "(Groq e OpenRouter têm tier grátis; Pollinations não precisa de chave).\n\n"+
         "Enquanto isso, uso as ferramentas e funções locais.\n\n"+
         "<span class='pill'>erro</span> "+esc(erro).slice(0,160);
  const local = localTool(q);
  if(local) out += "\n\n"+md(local);
  return md(out);
}

/* --------------------------------------------------------- ferramentas locais */
function localTool(q){
  const s=q.trim();
  // matematica segura
  if(/^[\d\s+\-*/().,%^]+$/.test(s) && /\d/.test(s)){
    try{
      const v = Function('"use strict";return ('+s.replace(/\^/g,"**").replace(/%/g,"/100")+')')();
      if(typeof v==="number" && isFinite(v)) return "**Calc:** `"+esc(s)+"` = **"+v+"**";
    }catch(e){}
  }
  const cu = s.match(/^([\d.,]+)\s*(km|mi|m|ft|kg|lb|c|f|l|gal)\s*(?:para|em|to)\s*(km|mi|m|ft|kg|lb|c|f|l|gal)$/i);
  if(cu){
    const v=parseFloat(cu[1].replace(",",".")), a=cu[2].toLowerCase(), b=cu[3].toLowerCase();
    const T={km:1000,mi:1609.344,m:1,ft:0.3048,kg:1,lb:0.453592,l:1,gal:3.78541};
    const temp=a==="c"||a==="f";
    let r;
    if(temp){ r = a==="c" ? v*9/5+32 : (v-32)*5/9; }
    else r = v*(T[a]/T[b]);
    return `**Conversão:** ${v} ${a} = **${r.toFixed(4).replace(/\.?0+$/,"")}** ${b}`;
  }
  if(/^(base64|b64)\s+/i.test(s)){
    const p=s.replace(/^(base64|b64)\s+/i,"");
    try{ return "**Base64:** `"+btoa(unescape(encodeURIComponent(p)))+"`"; }catch(e){}
  }
  if(/^(ajuda|help|comandos)/i.test(s)){
    return "Posso usar estas ferramentas (dados reais, sem chave):\n"+
      API.map(a=>"• "+a.name+" — "+a.desc).join("\n")+
      "\n\nFunções locais: `2+2*10`, `100 km para mi`, `32 c para f`, `base64 texto`";
  }
  return null;
}

/* ============================================================== AUTOTESTE */
async function testar(id){
  const spec=API_BY_ID[id]; const el=document.querySelector('[data-tile="'+id+'"] .st');
  if(el){ el.textContent="…"; el.className="st"; }
  const t0=performance.now();
  try{
    const args={}; (spec.args||[]).forEach(a=>args[a.k]=a.ph);
    const r=await spec.run(args);
    const ok = !!r && String(r).length>3;
    state.tests[id]={ok,ms:Math.round(performance.now()-t0),at:Date.now()};
    if(el){ el.textContent=ok?"ok":"?"; el.className="st "+(ok?"ok":"no"); }
  }catch(e){
    state.tests[id]={ok:false,err:e.message,at:Date.now()};
    if(el){ el.textContent="falhou"; el.className="st no"; }
  }
  save();
}
async function testarTudo(){
  const ids=API.map(a=>a.id);
  for(let i=0;i<ids.length;i+=6){
    await Promise.all(ids.slice(i,i+6).map(testar));
  }
  toast("Autoteste concluído");
  renderStatus();
}
async function testarLLM(){
  const out=$("#llmtest");
  out.textContent="testando…";
  const linhas=[];
  for(const p of PROVIDERS){
    if(p.needsKey && !state.keys[p.id]){ linhas.push(`• ${p.name}: sem chave`); continue; }
    const t0=performance.now();
    try{
      const r=await p.call([{role:"user",content:"diga apenas: ok"}], state.keys[p.id], state.model);
      linhas.push(`• ${p.name}: **OK** ${Math.round(performance.now()-t0)}ms — ${String(r).slice(0,60)}`);
    }catch(e){ linhas.push(`• ${p.name}: falhou — ${e.message.slice(0,80)}`); }
  }
  out.innerHTML=md(linhas.join("\n"));
}

/* ============================================================== PAINEIS */
function renderTools(){
  const el=$("#tools"); el.innerHTML="";
  CATS.forEach(c=>{
    const sec=document.createElement("div"); sec.className="sec";
    sec.innerHTML='<h3>'+esc(c)+'</h3>';
    const grid=document.createElement("div"); grid.className="grid";
    API.filter(a=>a.cat===c).forEach(a=>{
      const t=document.createElement("div"); t.className="tile"; t.dataset.tile=a.id;
      const st=state.tests[a.id];
      t.innerHTML=`<span class="st ${st?(st.ok?"ok":"no"):""}">${st?(st.ok?"ok":"falhou"):"testar"}</span>
        <h4>${esc(a.name)}</h4><p>${esc(a.desc)}</p>`;
      t.onclick=()=>usarFerramenta(a);
      grid.appendChild(t);
    });
    sec.appendChild(grid); el.appendChild(sec);
  });
}
async function usarFerramenta(a){
  navTo("chat");
  let args={};
  if(a.args){
    for(const spec of a.args){
      const v=prompt(spec.label||spec.k, spec.ph||"");
      if(v===null) return;
      args[spec.k]=v||spec.ph;
    }
  }
  bubble("me", "🔧 "+esc(a.name)+(Object.keys(args).length?" — "+esc(JSON.stringify(args)):""));
  const {t,v}=await tries(()=>a.run(args), "consultando "+a.name);
  if(v!==null) t.done("<b>"+esc(a.name)+"</b>\n"+md(v));
}
function renderStatus(){
  const el=$("#status"); if(!el) return;
  const total=API.length;
  const ok=Object.values(state.tests).filter(t=>t.ok).length;
  const off=!navigator.onLine;
  el.innerHTML=
   `<div class="card">
      <div class="kv"><span>Rede</span><b>${off?"offline":"online"}</b></div>
      <div class="kv"><span>APIs no catálogo</span><b>${total}</b></div>
      <div class="kv"><span>Testadas e OK</span><b>${ok}</b></div>
      <div class="kv"><span>Falharam / não testadas</span><b>${total-ok}</b></div>
      <div class="row" style="margin-top:10px">
        <button class="b" id="btnTestAll">Testar todas</button>
        <button class="g" id="btnTestLLM">Testar modelos</button>
      </div>
      <p class="muted" style="margin-top:10px">O teste roda no seu navegador: falha aqui quase sempre
      significa bloqueio de CORS, e não que a API esteja fora do ar.</p>
    </div>
    <div class="card"><h3 style="margin:0 0 8px">Modelos</h3><div id="llmtest" class="muted">—</div></div>
    <div class="card">${Object.keys(state.tests).length?
      API.filter(a=>state.tests[a.id]).map(a=>{
        const t=state.tests[a.id];
        return `<div class="kv"><span>${esc(a.name)}</span><b style="color:${t.ok?"var(--acc)":"var(--err)"}">${t.ok?t.ms+"ms":"falhou"}</b></div>`;
      }).join(""):'<p class="muted">Nada testado ainda.</p>'}</div>`;
  $("#btnTestAll").onclick=testarTudo;
  $("#btnTestLLM").onclick=testarLLM;
}
function renderCfg(){
  const el=$("#cfg");
  el.innerHTML=
   `<div class="card">
      <h3 style="margin:0 0 6px">Provedor de linguagem</h3>
      <label>Estratégia</label>
      <select id="prov">
        <option value="auto">Automático (sem chave primeiro)</option>
        ${PROVIDERS.filter(p=>p.needsKey).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")}
      </select>
      <label>Modelo (opcional; vazio = padrão do provedor)</label>
      <input id="model" placeholder="ex: llama-3.3-70b-versatile">
      <p class="muted" style="margin-top:8px">Chaves ficam só neste dispositivo (localStorage).
      Groq e OpenRouter têm tier gratuito; Pollinations funciona sem chave.</p>
    </div>
    <div class="card">
      <h3 style="margin:0 0 6px">Chaves</h3>
      ${PROVIDERS.filter(p=>p.needsKey).map(p=>`
        <label>${esc(p.name)}</label>
        <input data-key="${p.id}" type="password" placeholder="cole aqui" value="${esc(state.keys[p.id]||"")}">`).join("")}
      <div class="row" style="margin-top:10px">
        <button class="b" id="btnSaveKeys">Salvar</button>
        <button class="g" id="btnClearKeys">Limpar</button>
      </div>
    </div>
    <div class="card">
      <h3 style="margin:0 0 6px">Voz</h3>
      <label><input type="checkbox" id="voiceChk" ${state.voice?"checked":""}> Ler respostas em voz alta</label>
      <p class="muted" style="margin-top:8px">Usa a síntese de voz do sistema — funciona offline.</p>
    </div>
    <div class="card">
      <h3 style="margin:0 0 6px">Dados locais</h3>
      <div class="kv"><span>Mensagens na conversa</span><b>${state.msgs.length}</b></div>
      <div class="row" style="margin-top:10px">
        <button class="g" id="btnExport">Exportar .json</button>
        <button class="g" id="btnImport">Importar</button>
      </div>
      <input type="file" id="fileIn" accept="application/json" class="hidden">
      <button class="g" id="btnWipe" style="margin-top:8px">Apagar histórico</button>
    </div>`;
  $("#prov").value=state.provider;
  $("#model").value=state.model||"";
  $("#prov").onchange=e=>{ state.provider=e.target.value; save(); };
  $("#model").onchange=e=>{ state.model=e.target.value; save(); };
  $("#btnSaveKeys").onclick=()=>{
    document.querySelectorAll("[data-key]").forEach(i=>state.keys[i.dataset.key]=i.value.trim());
    save(); toast("Chaves salvas");
  };
  $("#btnClearKeys").onclick=()=>{ state.keys={}; save(); renderCfg(); toast("Chaves removidas"); };
  $("#voiceChk").onchange=e=>{ state.voice=e.target.checked; save(); };
  $("#btnWipe").onclick=()=>{ state.msgs=[]; save(); const c=chat(); if(c) c.innerHTML=""; boasVindas(); toast("Histórico apagado"); };
  $("#btnExport").onclick=()=>{
    const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="skynetchat-"+new Date().toISOString().slice(0,10)+".json";
    a.click(); URL.revokeObjectURL(a.href); toast("Exportado");
  };
  $("#btnImport").onclick=()=>$("#fileIn").click();
  $("#fileIn").onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{ try{
      const d=JSON.parse(r.result);
      if(Array.isArray(d.msgs)) state.msgs=d.msgs;
      if(d.keys) state.keys=d.keys;
      save(); navTo("chat"); toast("Importado");
    }catch(err){ toast("arquivo inválido"); } };
    r.readAsText(f);
  };
}

function navTo(tab){
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  main.className = tab==="chat" ? "chatpad" : "";
  $("#composer").classList.toggle("hidden", tab!=="chat");
  let html="";
  if(tab==="chat"){ main.innerHTML='<div id="chat"></div>'; state.msgs.forEach(m=>{
      const c=m.role==="user"?"me":(m.role==="assistant"?"":"");
      bubble(c, md(m.content));
    }); if(!state.msgs.length) boasVindas(); return; }
  if(tab==="tools"){ html='<div id="tools"></div>'; }
  if(tab==="status"){ html='<div id="status"></div>'; }
  if(tab==="cfg"){ html='<div id="cfg"></div>'; }
  main.innerHTML=html;
  if(tab==="tools") renderTools();
  if(tab==="status") renderStatus();
  if(tab==="cfg") renderCfg();
}
function boasVindas(){
  bubble("", "**SkynetChat** — 50 ferramentas reais, um arquivo só.\n\n"+
    "Uso dados reais de APIs públicas quando dá, e converso por modelo de linguagem quando há chave.\n\n"+
    "Tente: `clima em Lisboa`, `bitcoin`, `dólar`, `wikipédia fotossíntese`, `hacker news`.\n"+
    "Ou matemática e conversão: `2+2*10`, `100 km para mi`.\n\n"+
    "Abra **Ferramentas** para ver tudo, e **Status → Testar todas** para descobrir quais funcionam aqui.");
}

/* ============================================================== VOZ */
let rec=null;
function voz(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ toast("Reconhecimento de voz não suportado"); return; }
  if(rec){ rec.stop(); rec=null; $("#btnVoice").textContent="🎤"; return; }
  rec=new SR(); rec.lang="pt-BR"; rec.interimResults=false; rec.maxAlternatives=1;
  $("#btnVoice").textContent="🔴";
  rec.onresult=e=>{ txt.value=e.results[0][0].transcript; enviar(); };
  rec.onerror=()=>{ toast("Voz: erro"); };
  rec.onend=()=>{ rec=null; $("#btnVoice").textContent="🎤"; };
  rec.start();
}
function falar(t){
  if(!state.voice || !window.speechSynthesis) return;
  const u=new SpeechSynthesisUtterance(t.replace(/[*`#>]/g,"").slice(0,600));
  u.lang="pt-BR"; speechSynthesis.speak(u);
}

/* ============================================================== EVENTOS */
$("#send").onclick=enviar;
$("#btnNew").onclick=()=>{ state.msgs=[]; save(); const c=chat(); if(c) c.innerHTML=""; boasVindas(); };
$("#btnMenu").onclick=()=>{ const n=$("#nav"); n.style.display = n.style.display==="flex" ? "none" : "flex"; };
$("#btnVoice").onclick=voz;
$("#btnStop").onclick=()=>{ if(speechSynthesis) speechSynthesis.cancel(); toast("Voz parada"); };
txt.addEventListener("input",()=>{ txt.style.height="auto"; txt.style.height=Math.min(txt.scrollHeight,120)+"px"; });
txt.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); enviar(); } });
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>navTo(b.dataset.tab));
window.addEventListener("online",()=>$("#net").classList.add("on"));
window.addEventListener("offline",()=>$("#net").classList.remove("on"));
$("#net").classList.toggle("on", navigator.onLine);
document.addEventListener("visibilitychange",()=>save());

// init
$("#nav").style.display="flex";
navTo("chat");
window.Skynet = {state, API, testarTudo, usarFerramenta, detectar, localTool, md, esc, extrairArgs, PROVIDERS, testar};
</script>
