<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d11">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SkynetChat — IA local, sem intermediário</title>
<style>
:root{
  --bg:#0b0d11;--panel:#11141a;--card:#161a22;--line:#232833;
  --fg:#e9edf3;--dim:#8b95a7;--acc:#7dd3fc;--acc2:#a78bfa;--ok:#4ade80;--err:#f87171;--warn:#fbbf24;
  --r:14px;--sb:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root{--bg:#f6f7f9;--panel:#fff;--card:#fff;--line:#e2e6ed;--fg:#12161d;--dim:#586274;--acc:#0284c7;--acc2:#7c3aed}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif}
#app{display:flex;flex-direction:column;height:100dvh;max-width:860px;margin:0 auto;position:relative}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--line);z-index:20}
.brand{font-weight:800;font-size:17px;letter-spacing:.2px}
.brand span{color:var(--acc2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--err);flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.dot.wait{background:var(--warn)}
.spacer{flex:1}
.ib{background:transparent;border:1px solid var(--line);color:var(--fg);border-radius:10px;
    min-width:38px;height:34px;cursor:pointer;font-size:15px;display:inline-flex;align-items:center;justify-content:center;padding:0 8px}
.ib:active{transform:scale(.94)}
nav{display:flex;gap:4px;padding:6px 8px;background:var(--panel);border-bottom:1px solid var(--line)}
nav button{flex:1;background:transparent;border:0;color:var(--dim);padding:8px;font-size:13px;font-weight:600;border-radius:10px;cursor:pointer}
nav button.on{background:var(--card);color:var(--fg)}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px calc(96px + var(--sb))}
.msg{display:flex;margin-bottom:10px}
.msg.me{justify-content:flex-end}
.bub{max-width:88%;padding:10px 13px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);
     white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
.msg.me .bub{background:var(--acc2);color:#fff;border-color:transparent;font-weight:500}
.bub b{color:var(--acc)}
.bub code{background:rgba(127,127,127,.2);padding:1px 5px;border-radius:5px;font-size:13px}
.bub pre{background:rgba(127,127,127,.14);padding:10px;border-radius:10px;overflow-x:auto}
.bub pre code{background:none;padding:0}
.bub a{color:var(--acc)}
.bub ul{margin:6px 0;padding-left:20px}
.cur{border-left:2px solid var(--acc2)}
.meta{font-size:11px;color:var(--dim);margin-top:6px;font-variant-numeric:tabular-nums}
.composer{position:absolute;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);
  padding:8px 10px calc(8px + var(--sb));display:flex;gap:8px;align-items:flex-end;z-index:30}
textarea{flex:1;resize:none;border:1px solid var(--line);background:var(--card);color:var(--fg);
  border-radius:12px;padding:10px 12px;font:inherit;max-height:130px;min-height:42px;outline:none}
textarea:focus{border-color:var(--acc2)}
.send{background:var(--acc2);color:#fff;border:0;border-radius:12px;height:42px;min-width:56px;font-weight:800;cursor:pointer}
.send:disabled{opacity:.4}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.card h3{margin:0 0 8px;font-size:14px}
label{display:block;font-size:12px;color:var(--dim);margin:8px 0 4px}
input,select,textarea.f{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--fg);
  border-radius:10px;padding:9px 11px;font:inherit;outline:none}
textarea.f{min-height:90px;resize:vertical}
.row{display:flex;gap:8px}
.row>*{flex:1}
button.b{background:var(--acc2);color:#fff;border:0;border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer;width:100%}
button.g{background:transparent;border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:9px 12px;cursor:pointer;width:100%}
.muted{color:var(--dim);font-size:12px;line-height:1.5}
.kv{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.kv:last-child{border:0}
.kv b{font-variant-numeric:tabular-nums;max-width:55%;text-align:right;word-break:break-all}
.ep{display:flex;align-items:center;gap:8px;padding:9px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer;background:var(--panel)}
.ep.on{border-color:var(--acc2)}
.ep .nm{flex:1;font-weight:600;font-size:14px}
.ep .st{font-size:11px;padding:2px 7px;border-radius:20px;background:var(--line);color:var(--dim)}
.ep .st.ok{background:rgba(74,222,128,.16);color:var(--ok)}
.ep .st.no{background:rgba(248,113,113,.16);color:var(--err)}
.pill{display:inline-block;padding:3px 9px;border-radius:20px;background:var(--line);font-size:11px;color:var(--dim);margin:2px 4px 2px 0}
.hidden{display:none!important}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + var(--sb));background:var(--fg);color:var(--bg);
  padding:8px 14px;border-radius:20px;font-size:13px;font-weight:600;z-index:99;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1}
.warnbox{border-left:3px solid var(--warn);padding:8px 10px;background:rgba(251,191,36,.08);border-radius:0 8px 8px 0;font-size:12.5px;line-height:1.5}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">Skynet<span>Chat</span></div>
    <div id="dot" class="dot" title="servidor de inferência"></div>
    <div class="spacer"></div>
    <button class="ib" id="bStop" title="parar geração" hidden>⏹</button>
    <button class="ib" id="bNew" title="nova conversa">＋</button>
    <button class="ib" id="bMenu" title="painéis">☰</button>
  </header>
  <nav id="nav">
    <button data-t="chat" class="on">Chat</button>
    <button data-t="modelo">Modelo</button>
    <button data-t="ajustes">Ajustes</button>
    <button data-t="diag">Diagnóstico</button>
  </nav>
  <main id="main"><div id="chat"></div></main>
  <div class="composer" id="comp">
    <textarea id="txt" rows="1" placeholder="Conecte um servidor local na aba Modelo…"></textarea>
    <button class="send" id="send">Enviar</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============================================================================
   SkynetChat — cliente de IA 100% local.

   O que isto e:
     uma interface para modelos que VOCE roda no SEU equipamento
     (Ollama, LM Studio, llama.cpp, KoboldCpp, vLLM...). Nenhuma empresa
     fica entre voce e o modelo: nao ha API de terceiro, nao ha chave,
     nao ha telemetria. O prompt que voce escreve e o prompt que chega
     ao modelo — inclusive o system prompt, que e seu.

   O que isto NAO e:
     nao e uma ferramenta para burlar protecoes de modelos de terceiros.
     Modelos alheios (ChatGPT, Claude, Gemini) tem termos de uso e filtros
     que pertencem a quem os opera; este app nao toca neles e nao inclui
     biblioteca de jailbreak. O que da liberdade aqui e rodar o peso localmente.
   ========================================================================== */

const $ = s => document.querySelector(s);
const txt = $("#txt"), main = $("#main"), chat = () => $("#chat");
const LS = "skynet.v1";

const state = load();
function load(){
  try{
    return Object.assign({
      ep:"", kind:"openai", model:"", system:"", convs:[], conv:0,
      p:{temperature:0.8, top_p:0.9, top_k:40, repeat_penalty:1.1, num_ctx:8192, max_tokens:-1}
    }, JSON.parse(localStorage.getItem(LS)||"{}"));
  }catch(e){
    return {ep:"",kind:"openai",model:"",system:"",convs:[[]],conv:0,
      p:{temperature:0.8,top_p:0.9,top_k:40,repeat_penalty:1.1,num_ctx:8192,max_tokens:-1}};
  }
}
function save(){ try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){} }
if(!state.convs || !state.convs.length) state.convs=[[]];
const msgs = () => state.convs[state.conv] || (state.convs[state.conv]=[]);

function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("on"),1800); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function md(s){
  let h=esc(s);
  h=h.replace(/```(\w*)\n?([\s\S]*?)```/g,(m,l,c)=>"<pre><code>"+c.replace(/\n$/,"")+"</code></pre>");
  h=h.replace(/`([^`\n]+)`/g,"<code>$1</code>");
  h=h.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
  h=h.replace(/\*([^*\n]+)\*/g,"<i>$1</i>");
  h=h.replace(/(^|\n)[-*] (.+)/g,"$1• $2");
  h=h.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  return h;
}
function bub(cls, html){
  const d=document.createElement("div"); d.className="msg"+(cls?" "+cls:"");
  const b=document.createElement("div"); b.className="bub"+(cls==="ai"?" cur":""); b.innerHTML=html;
  d.appendChild(b); const c=chat(); if(c) c.appendChild(d);
  main.scrollTop=main.scrollHeight; return b;
}

/* ------------------------------------------------------------- PRESETS */
const PRESETS = [
  {id:"ollama",   nm:"Ollama",                base:"http://localhost:11434", kind:"ollama",
   models:"/api/tags",              chat:"/api/chat"},
  {id:"lmstudio", nm:"LM Studio",             base:"http://localhost:1234",  kind:"openai",
   models:"/v1/models",             chat:"/v1/chat/completions"},
  {id:"llamacpp", nm:"llama.cpp server",      base:"http://localhost:8080",  kind:"openai",
   models:"/v1/models",             chat:"/v1/chat/completions"},
  {id:"kobold",   nm:"KoboldCpp",             base:"http://localhost:5001",  kind:"openai",
   models:"/v1/models",             chat:"/v1/chat/completions"},
  {id:"textgen",  nm:"text-generation-webui", base:"http://localhost:5000",  kind:"openai",
   models:"/v1/models",             chat:"/v1/chat/completions"},
  {id:"vllm",     nm:"vLLM",                  base:"http://localhost:8000",  kind:"openai",
   models:"/v1/models",             chat:"/v1/chat/completions"},
  {id:"localai",  nm:"LocalAI",               base:"http://localhost:8080",  kind:"openai",
   models:"/v1/models",             chat:"/v1/chat/completions"},
];

/* --------------------------------------------------------- CONECTIVIDADE */
async function ping(base, path, ms=3500){
  const c=new AbortController(); const t=setTimeout(()=>c.abort(), ms);
  try{
    const r=await fetch(base+path,{signal:c.signal,headers:{Accept:"application/json"}});
    return {ok:r.ok, code:r.status};
  }catch(e){
    return {ok:false, code:0, err: e.name==="AbortError" ? "timeout" : "bloqueado (CORS/rede)"};
  } finally { clearTimeout(t); }
}
async function listarModelos(){
  if(!state.ep) return [];
  try{
    if(state.kind==="ollama"){
      const c=new AbortController(); const t=setTimeout(()=>c.abort(),5000);
      const r=await fetch(state.ep+"/api/tags",{signal:c.signal}); clearTimeout(t);
      if(!r.ok) throw new Error("HTTP "+r.status);
      const d=await r.json();
      return (d.models||[]).map(m=>m.name || m.model).filter(Boolean);
    }
    const c=new AbortController(); const t=setTimeout(()=>c.abort(),5000);
    const r=await fetch(state.ep+"/v1/models",{signal:c.signal}); clearTimeout(t);
    if(!r.ok) throw new Error("HTTP "+r.status);
    const d=await r.json();
    return (d.data||[]).map(m=>m.id).filter(Boolean);
  }catch(e){ toast("Falhou ao listar: "+e.message); return []; }
}

/* --------------------------------------------------------- STREAM PARSERS */
// OpenAI-compat: SSE, linhas "data: {...}" terminando em "data: [DONE]"
async function streamOpenAI(url, body, onTok, signal){
  const r=await fetch(url,{method:"POST",signal,
    headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok){ const t=await r.text().catch(()=>""); throw new Error("HTTP "+r.status+" "+t.slice(0,140)); }
  if(!r.body) throw new Error("resposta sem corpo (streaming desativado?)");
  const rd=r.body.getReader(), dec=new TextDecoder(); let buf="";
  while(true){
    const {done,value}=await rd.read(); if(done) break;
    buf+=dec.decode(value,{stream:true});
    const ls=buf.split("\n"); buf=ls.pop();
    for(const ln of ls){
      const s=ln.trim();
      if(!s.startsWith("data:")) continue;
      const d=s.slice(5).trim();
      if(d==="[DONE]") return;
      try{ const j=JSON.parse(d); const c=j.choices?.[0]?.delta?.content; if(c) onTok(c); }catch(e){}
    }
  }
}
// Ollama nativo: NDJSON, {"message":{"content":"..."},"done":bool}
async function streamOllama(url, body, onTok, signal){
  const r=await fetch(url,{method:"POST",signal,
    headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok){ const t=await r.text().catch(()=>""); throw new Error("HTTP "+r.status+" "+t.slice(0,140)); }
  const rd=r.body.getReader(), dec=new TextDecoder(); let buf="";
  while(true){
    const {done,value}=await rd.read(); if(done) break;
    buf+=dec.decode(value,{stream:true});
    const ls=buf.split("\n"); buf=ls.pop();
    for(const ln of ls){
      if(!ln.trim()) continue;
      try{
        const j=JSON.parse(ln);
        if(j.message && j.message.content) onTok(j.message.content);
        if(j.done) return;
      }catch(e){}
    }
  }
}

/* ------------------------------------------------------------- GERACAO */
let ctl=null;
async function enviar(){
  const q=txt.value.trim(); if(!q) return;
  if(!state.ep){ toast("Conecte um servidor na aba Modelo"); navTo("modelo"); return; }
  if(!state.model){ toast("Escolha um modelo"); navTo("modelo"); return; }
  txt.value=""; txt.style.height="auto";
  msgs().push({role:"user",content:q}); save();
  bub("me", esc(q));
  await gerar();
}
async function gerar(){
  const hist = msgs().map(m=>({role:m.role,content:m.content}));
  if(state.system) hist.unshift({role:"system",content:state.system});

  const el=bub("ai","");
  ctl=new AbortController(); $("#bStop").hidden=false; $("#dot").className="dot wait";
  let acc="", t0=performance.now(), toks=0;
  const onTok=s=>{ acc+=s; toks++; el.innerHTML=md(acc); main.scrollTop=main.scrollHeight; };

  try{
    if(state.kind==="ollama"){
      const body={model:state.model, messages:hist, stream:true,
        options:{temperature:state.p.temperature, top_p:state.p.top_p, top_k:state.p.top_k,
                 repeat_penalty:state.p.repeat_penalty, num_ctx:state.p.num_ctx}};
      await streamOllama(state.ep+"/api/chat", body, onTok, ctl.signal);
    } else {
      const body={model:state.model, messages:hist, stream:true,
        temperature:state.p.temperature, top_p:state.p.top_p};
      if(state.p.max_tokens>0) body.max_tokens=state.p.max_tokens;
      await streamOpenAI(state.ep+"/v1/chat/completions", body, onTok, ctl.signal);
    }
    const dt=(performance.now()-t0)/1000;
    el.innerHTML=md(acc)+`<div class="meta">${toks} tok · ${dt.toFixed(1)}s · ${(toks/dt).toFixed(1)} tok/s</div>`;
    msgs().push({role:"assistant",content:acc}); save();
    $("#dot").className="dot on";
  }catch(e){
    if(e.name==="AbortError"){ el.innerHTML=md(acc)+'<div class="meta">interrompido</div>'; }
    else{ el.innerHTML='<span style="color:var(--err)">Falhou: '+esc(e.message)+'</span>'; $("#dot").className="dot"; }
  }finally{ ctl=null; $("#bStop").hidden=true; }
}
$("#bStop").onclick=()=>{ if(ctl){ ctl.abort(); ctl=null; } };

/* ------------------------------------------------------------- PAINEIS */
function navTo(t){
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
  if(t==="chat"){ main.innerHTML='<div id="chat"></div>';
    msgs().forEach(m=>bub(m.role==="user"?"me":"ai", md(m.content)));
    if(!msgs().length) boasVindas(); return; }
  main.innerHTML = '<div id="pane"></div>';
  if(t==="modelo") renderModelo();
  if(t==="ajustes") renderAjustes();
  if(t==="diag") renderDiag();
}
function boasVindas(){
  bub("ai", "**SkynetChat** — cliente de IA local.\n\n"+
    "Rode um modelo no seu equipamento (Ollama, LM Studio, llama.cpp…) e conecte na aba **Modelo**.\n\n"+
    "Como o modelo roda na sua máquina, **não existe empresa alguma entre você e a resposta**. "+
    "O system prompt é seu, o histórico fica no seu navegador, nada sai daqui.\n\n"+
    "Se não tiver modelo instalado, a aba **Diagnóstico** mostra o que é preciso.");
}
function renderModelo(){
  const p=$("#pane");
  p.innerHTML=
   `<div class="card">
      <h3>Servidor de inferência</h3>
      <div id="eps"></div>
      <label>Endpoint personalizado (OpenAI-compatível)</label>
      <input id="custom" placeholder="http://192.168.0.10:1234">
      <div class="row" style="margin-top:8px">
        <button class="b" id="useCustom">Usar este</button>
        <button class="g" id="probe">Testar</button>
      </div>
      <p class="muted" style="margin-top:10px">
        Rodando como arquivo local, o navegador pode bloquear por CORS.
        No Ollama, inicie com <code>OLLAMA_ORIGINS=*</code>.
      </p>
    </div>
    <div class="card">
      <h3>Modelo</h3>
      <select id="sel"><option value="">— escolha —</option></select>
      <div class="row" style="margin-top:8px">
        <button class="g" id="refresh">Recarregar lista</button>
      </div>
    </div>
    <div class="card">
      <h3>Conversas</h3>
      <div id="convs"></div>
      <div class="row" style="margin-top:8px">
        <button class="g" id="exp">Exportar .json</button>
        <button class="g" id="wipe">Apagar tudo</button>
      </div>
    </div>`;
  const box=$("#eps");
  PRESETS.forEach(pr=>{
    const d=document.createElement("div"); d.className="ep"+(state.ep===pr.base?" on":"");
    d.innerHTML=`<div class="nm">${esc(pr.nm)}</div><div class="st">testar</div>`;
    d.onclick=async()=>{
      const st=d.querySelector(".st"); st.textContent="…";
      const r=await ping(pr.base, pr.models);
      if(r.ok){
        state.ep=pr.base; state.kind=pr.kind; save();
        st.textContent="ok"; st.className="st ok";
        toast(pr.nm+" conectado"); await popularModelos(); renderModelo();
      } else {
        st.textContent=r.code||"x"; st.className="st no";
        toast(pr.nm+": "+(r.err||("HTTP "+r.code)));
      }
    };
    box.appendChild(d);
  });
  $("#useCustom").onclick=async()=>{
    const v=$("#custom").value.trim().replace(/\/$/,"");
    if(!v) return toast("cole uma URL");
    const r=await ping(v,"/v1/models");
    if(!r.ok) return toast("sem resposta: "+(r.err||("HTTP "+r.code)));
    state.ep=v; state.kind="openai"; save(); toast("conectado"); await popularModelos(); renderModelo();
  };
  $("#probe").onclick=async()=>{
    const v=$("#custom").value.trim().replace(/\/$/,"")||state.ep;
    if(!v) return toast("cole uma URL");
    const r=await ping(v,"/v1/models"); const r2=await ping(v,"/api/tags");
    toast(`/v1/models: ${r.code||r.err} · /api/tags: ${r2.code||r2.err}`);
  };
  $("#refresh").onclick=async()=>{ await popularModelos(); renderModelo(); };
  $("#sel").onchange=e=>{ state.model=e.target.value; save(); toast("modelo: "+state.model); };
  const cv=$("#convs");
  state.convs.forEach((c,i)=>{
    const d=document.createElement("div"); d.className="ep"+(i===state.conv?" on":"");
    d.innerHTML=`<div class="nm">Conversa ${i+1} <span class="pill">${c.length} msgs</span></div>`;
    d.onclick=()=>{ state.conv=i; save(); navTo("chat"); };
    cv.appendChild(d);
  });
  $("#exp").onclick=()=>{
    const b=new Blob([JSON.stringify(state.convs,null,2)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(b);
    a.download="skynet-conversas.json"; a.click(); URL.revokeObjectURL(a.href);
  };
  $("#wipe").onclick=()=>{ if(confirm("Apagar conversas e config?")){ localStorage.removeItem(LS); location.reload(); } };
  popularModelos();
}
async function popularModelos(){
  const sel=$("#sel"); if(!sel) return;
  const ms=await listarModelos();
  sel.innerHTML='<option value="">— escolha —</option>'+ms.map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join("");
  if(state.model && ms.includes(state.model)) sel.value=state.model;
  else if(ms.length){ sel.value=ms[0]; state.model=ms[0]; save(); }
  if(ms.length) $("#dot").className="dot on";
}
function renderAjustes(){
  const p=$("#pane");
  p.innerHTML=
   `<div class="card">
      <h3>System prompt</h3>
      <p class="muted">É o seu modelo, na sua máquina: o prompt de sistema é inteiramente seu.
      Vazio = nenhuma persona imposta.</p>
      <textarea class="f" id="sys" placeholder="ex: responda sempre em português, de forma direta">${esc(state.system)}</textarea>
      <div class="row" style="margin-top:8px">
        <button class="g" data-s="">Neutro (vazio)</button>
        <button class="g" data-s="Você é um assistente direto e preciso. Responda em português.">Direto</button>
      </div>
      <div class="row" style="margin-top:6px">
        <button class="g" data-s="Você é um programador sênior. Mostre código completo e explique decisões.">Programador</button>
        <button class="g" data-s="Você é um professor paciente. Explique passo a passo com exemplos.">Professor</button>
      </div>
    </div>
    <div class="card">
      <h3>Amostragem</h3>
      <label>Temperatura <b id="vTemp"></b></label>
      <input type="range" id="temp" min="0" max="2" step="0.05">
      <label>top_p <b id="vTopP"></b></label>
      <input type="range" id="topp" min="0" max="1" step="0.05">
      <label>top_k <b id="vTopK"></b></label>
      <input type="range" id="topk" min="0" max="200" step="1">
      <label>repeat_penalty <b id="vRep"></b></label>
      <input type="range" id="rep" min="1" max="2" step="0.05">
      <label>Contexto (num_ctx) <b id="vCtx"></b></label>
      <input type="range" id="ctx" min="512" max="131072" step="512">
      <label>Máx. tokens (-1 = sem limite)</label>
      <input type="number" id="max">
    </div>
    <div class="card">
      <h3>Estado</h3>
      <div class="kv"><span>Endpoint</span><b>${esc(state.ep||"—")}</b></div>
      <div class="kv"><span>Protocolo</span><b>${esc(state.kind)}</b></div>
      <div class="kv"><span>Modelo</span><b>${esc(state.model||"—")}</b></div>
      <div class="kv"><span>Conversas</span><b>${state.convs.length}</b></div>
      <p class="muted" style="margin-top:10px">Tudo em localStorage. Nenhum dado sai deste navegador
      exceto para o endpoint que você configurou.</p>
    </div>`;
  const P=state.p;
  const lig=(id,vid,fmt)=>{ const el=$("#"+id), v=$("#"+vid);
    el.value=P[id==="topp"?"top_p":id==="topk"?"top_k":id];
    v.textContent=fmt? fmt(el.value) : el.value;
    el.oninput=()=>{ P[id==="topp"?"top_p":id==="topk"?"top_k":id]=parseFloat(el.value);
      v.textContent=fmt? fmt(el.value):el.value; save(); }; };
  lig("temp","vTemp"); lig("topp","vTopP"); lig("topk","vTopK"); lig("rep","vRep");
  const ctx=$("#ctx"); ctx.value=P.num_ctx; $("#vCtx").textContent=P.num_ctx;
  ctx.oninput=()=>{ P.num_ctx=parseInt(ctx.value); $("#vCtx").textContent=ctx.value; save(); };
  $("#max").value=P.max_tokens; $("#max").oninput=e=>{ P.max_tokens=parseInt(e.target.value)||-1; save(); };
  $("#sys").oninput=e=>{ state.system=e.target.value; save(); };
  document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{
    state.system=b.dataset.s; save(); $("#sys").value=state.system; toast("system prompt definido");
  });
}
async function renderDiag(){
  const p=$("#pane");
  p.innerHTML=`<div class="card"><h3>Testando endpoints locais…</h3>
    <div id="dlist"></div>
    <p class="muted" style="margin-top:10px">Este teste roda no SEU navegador.
    "bloqueado" quase sempre é CORS, não servidor fora do ar.</p></div>
    <div class="card"><h3>Como rodar um modelo</h3>
      <p class="muted">
      <b>Ollama</b> (mais simples):<br>
      <code>ollama pull llama3.2</code><br>
      <code>OLLAMA_ORIGINS=* ollama serve</code><br><br>
      <b>LM Studio</b> (interface gráfica): baixe um modelo, abra o
      "Local Server" na porta 1234.<br><br>
      <b>Modelos sem filtro de terceiro</b>: qualquer peso aberto que você
      baixar (Llama, Mistral, Qwen, Gemma…) roda igual aqui. A liberdade vem
      de você possuir os pesos — não de burlar nada.
      </p>
    </div>
    <div class="card warnbox">
      <b>Limite honesto:</b> isto não remove alinhamento que venha do
      próprio treinamento do modelo. Um modelo treinado para recusar certas
      coisas pode continuar recusando — isso é propriedade dos pesos, não
      desta interface. O que este app garante é que <b>nenhuma empresa</b> fica
      entre você e o modelo, e que o system prompt é inteiramente seu.
    </div>`;
  const box=$("#dlist");
  for(const pr of PRESETS){
    const d=document.createElement("div"); d.className="kv";
    d.innerHTML=`<span>${esc(pr.nm)} <span class="muted">${esc(pr.base)}</span></span><b>…</b>`;
    box.appendChild(d);
    const r=await ping(pr.base, pr.models, 2500);
    const b=d.querySelector("b");
    b.textContent = r.ok ? ("HTTP "+r.code) : (r.code?("HTTP "+r.code):(r.err||"falhou"));
    b.style.color = r.ok ? "var(--ok)" : "var(--err)";
  }
}

/* ------------------------------------------------------------- EVENTOS */
$("#send").onclick=enviar;
$("#bNew").onclick=()=>{ state.convs.push([]); state.conv=state.convs.length-1; save(); navTo("chat"); toast("nova conversa"); };
$("#bMenu").onclick=()=>{ const n=$("#nav"); n.style.display = n.style.display==="flex" ? "none" : "flex"; };
txt.addEventListener("input",()=>{ txt.style.height="auto"; txt.style.height=Math.min(txt.scrollHeight,130)+"px"; });
txt.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); enviar(); } });
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>navTo(b.dataset.t));
if(state.ep) ping(state.ep, state.kind==="ollama"?"/api/tags":"/v1/models")
  .then(r=>$("#dot").className = r.ok? "dot on":"dot");
navTo("chat");

window.Skynet = {state, PRESETS, ping, md, esc, streamOpenAI, streamOllama, save};
</script>
</body>
</html>
